version: '3.3'

services:
  backend:
    image: ghcr.io/wagmms/medquest-backend:latest
    build: 
      context: ./app/backend
    restart: always
    environment:
      - FLASK_ENV=production
      - PORT=8000
      - FRONTEND_URL=https://${DOMAIN}
      - TURSO_DATABASE_URL=${TURSO_DATABASE_URL}
      - TURSO_AUTH_TOKEN=${TURSO_AUTH_TOKEN}
      - CLERK_SECRET_KEY=${CLERK_SECRET_KEY}
      - NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
      - CURATOR_EMAILS=${CURATOR_EMAILS}
      - FLASK_API_PROXY_SECRET=${FLASK_API_PROXY_SECRET}
      - AI_PROVIDER_ORDER=${AI_PROVIDER_ORDER:-gemini}
      - AI_PRECEPTOR_PROVIDER_ORDER=${AI_PRECEPTOR_PROVIDER_ORDER:-gemini}
      - AI_DAILY_QUOTA_COOLDOWN=${AI_DAILY_QUOTA_COOLDOWN:-86400}
      - AI_GLOBAL_TIMEOUT_BUDGET=${AI_GLOBAL_TIMEOUT_BUDGET:-45}
      - AI_PROVIDER_TIMEOUT=${AI_PROVIDER_TIMEOUT:-25}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_API_KEYS=${GEMINI_API_KEYS:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-3.7-flash}
      - GEMINI_MODELS=${GEMINI_MODELS:-gemini-3.7-flash,gemini-3.6-flash,gemini-3.5-flash-lite}
      - GEMINI_ACCOUNT_QUOTA_COOLDOWN=${GEMINI_ACCOUNT_QUOTA_COOLDOWN:-86400}
    ports:
      - "127.0.0.1:8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    image: ghcr.io/wagmms/medquest-frontend:latest
    build:
      context: ./app/frontend
    restart: always
    environment:
      - NODE_ENV=production
      - PORT=3000
      - NEXT_PUBLIC_API_URL=https://${DOMAIN}/api
      - NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
      - CLERK_SECRET_KEY=${CLERK_SECRET_KEY}
      - FLASK_API_PROXY_SECRET=${FLASK_API_PROXY_SECRET}
      - FLASK_API_URL=http://backend:8000
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - backend

  caddy:
    image: caddy:2-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend

volumes:
  caddy_data:
  caddy_config:
