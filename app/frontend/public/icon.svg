<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#090e17"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Cross Gradient -->
    <linearGradient id="crossGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Center Radial Glow -->
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#0284c7" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>

    <!-- Subtle Pulse Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Layer -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <circle cx="256" cy="256" r="210" fill="url(#centerGlow)"/>

  <!-- Outer Ring Accent -->
  <circle cx="256" cy="256" r="198" fill="none" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.2" stroke-dasharray="8 6"/>

  <!-- Medical Cross Graphic -->
  <g id="medical-cross">
    <!-- Vertical Bar -->
    <rect x="220" y="126" width="72" height="260" rx="28" fill="url(#crossGrad)"/>
    <!-- Horizontal Bar -->
    <rect x="126" y="220" width="260" height="72" rx="28" fill="url(#crossGrad)"/>
  </g>

  <!-- ECG / Pulse Line Overlay (within safe zone) -->
  <path
    d="M 112 256
       L 182 256
       L 196 242
       L 210 256
       L 226 270
       L 252 144
       L 278 356
       L 298 256
       L 316 238
       L 332 256
       L 400 256"
    fill="none"
    stroke="#ffffff"
    stroke-width="15"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#glow)"
  />

  <!-- Subtle Accent Dot -->
  <circle cx="252" cy="144" r="6" fill="#38bdf8"/>
  <circle cx="278" cy="356" r="6" fill="#38bdf8"/>
</svg>
