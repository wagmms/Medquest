name: Quality, security and performance

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend Pytest & SLA Guardrails
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/backend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: app/backend/requirements.txt

      - name: Install dependencies
        run: |
          uv pip install --system -r requirements.txt pip-audit pytest-xdist

      - name: Run Hermetic Pytest Suite (Parallel)
        run: |
          pytest -q -n auto

      - name: Run Performance SLA Guardrails
        run: |
          python scripts/check_performance_guardrails.py

      - name: Verify governed pipeline inventory
        run: |
          python scripts/pipeline.py check

      - name: Block embedded credentials
        run: |
          python scripts/check_no_embedded_secrets.py

      - name: Security audit dependencies
        run: |
          pip-audit -r requirements.txt

  frontend:
    name: Frontend Lint, TypeCheck & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Security audit dependencies
        run: npm audit --audit-level=high

      - name: ESLint Check
        run: npm run lint -- --max-warnings=0

      - name: TypeScript Strict TypeCheck
        run: npx tsc --noEmit

      - name: Next.js Production Build & Performance Budgets
        run: npm run build
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          FLASK_API_PROXY_SECRET: ci-placeholder-not-used-during-build

  frontend-e2e:
    name: Frontend E2E (hermetic)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build standalone application
        run: npm run build
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          FLASK_API_PROXY_SECRET: ci-placeholder-not-used-during-build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run end-to-end tests
        run: npm run test:e2e
